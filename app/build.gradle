plugins {
    id 'com.android.application'
}

android {
    namespace 'io.lslegacy'
    compileSdk 34

    defaultConfig {
        applicationId 'io.lslegacy'
        // Plain Java/Dalvik, no native code: runs on ARMv6 (armeabi) as well as anything newer.
        minSdk 9
        // 22 = no runtime permissions; these devices predate them anyway.
        targetSdk 22
        versionCode 1
        versionName '0.1.0'
    }

    buildTypes {
        // BouncyCastle is far over the 64K method limit without shrinking, and multidex
        // on Dalvik is slow, so both build types go through R8.
        debug {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // Pure-Java TLS 1.2/1.3 with AES-GCM/ChaCha20, which Android < 5 lacks but LocalSend requires.
    implementation 'org.bouncycastle:bctls-jdk15to18:1.78.1'
    implementation 'org.bouncycastle:bcprov-jdk15to18:1.78.1'
}
